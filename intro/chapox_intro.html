.dash .term b{color:var(--neon);font-weight:400}

.dash .item svg{width:19px;height:19px;stroke:#bdbdbd;fill:none;stroke-width:1.6}
.dash .item.act{color:#f2f2f2}.dash .item.act svg{stroke:var(--neon)}
.dash .card{position:absolute;border:1.5px solid #212121;border-radius:11px;background:#0b0b0b;overflow:hidden}

<script>
// ============================================================ constants
const W = 1080, H = 1920, FX = 540, FY = 800, DUR = 9.0, FPS = 60;
const NEON = '#86FF00';
const BPM = 160, B = 60 / BPM, T0 = 0.05, bt = k => T0 + B * k;   // 160 BPM half-time, bar = 4 beats = 1.5 s
const META = { x_core: [169, 168], x_core_r: 33.2 };
const XB = 360 / 344;                                               // hook X display scale
const X_END = 1.15 * Math.hypot(540, 1120) / (META.x_core_r * XB);  // X scale that clears the farthest corner

// ============================================================ math
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const pr = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  inC: x => x * x * x, outC: x => 1 - (1 - x) ** 3, ioC: x => x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2,
  inQ: x => x * x, outQ: x => 1 - (1 - x) ** 2, inQ4: x => x ** 4, outQ4: x => 1 - (1 - x) ** 4,
  ioQ4: x => x < .5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2,
  ioQ5: x => x < .5 ? 16 * x ** 5 : 1 - (-2 * x + 2) ** 5 / 2,
  outExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : (1 - 2 ** (-10 * x)) / (1 - 2 ** -10),
  inExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : (2 ** (10 * x - 10) - 2 ** -10) / (1 - 2 ** -10),
  ioS: x => x * x * (3 - 2 * x),
};
// damped spring step response 0 -> 1 (k stiffness, d damping, unit mass), t in seconds; exact 0 before start
function spring(t, k = 170, d = 26) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + z * w0 / wd * Math.sin(wd * t)); }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
}
const llerp = (a, b, p) => Math.exp(lerp(Math.log(a), Math.log(b), p));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { const r = mulberry32(n * 7919 + 13); r(); return r(); };
const $ = id => document.getElementById(id);
const deg = r => r * 180 / Math.PI;

// 2.5D projection: world point (x,y) at depth dz seen by camera {x,y,z,roll,fx,fy}; s = 1/(z+dz)
function proj(cam, x, y, dz) {
  const zz = cam.z + dz; if (zz <= 0.04) return null;
  const s = 1 / zz;
  let sx = (x - cam.x) * s, sy = (y - cam.y) * s;
  const r = (cam.roll || 0) * Math.PI / 180, c = Math.cos(r), n = Math.sin(r);
  return { x: (cam.fx ?? FX) + sx * c - sy * n, y: (cam.fy ?? FY) + sx * n + sy * c, s, rot: cam.roll || 0 };
}
// write an element transform: centre at (x,y), scale, z-rotation, optional 3D tilt
function place(el, p, o = {}) {
  if (!p) { el.style.visibility = 'hidden'; return; }
  const w = o.w || 0, h = o.h || 0, s = p.s * (o.k ?? 1);
  let tr = `translate(${p.x.toFixed(2)}px,${p.y.toFixed(2)}px) rotate(${((p.rot || 0) + (o.rot || 0)).toFixed(3)}deg) scale(${s.toFixed(5)})`;
  if (o.ry || o.rx) tr += ` perspective(${o.persp || 2000}px) rotateY(${(o.ry || 0).toFixed(3)}deg) rotateX(${(o.rx || 0).toFixed(3)}deg)`;
  tr += ` translate(${-w / 2}px,${-h / 2}px)`;
  el.style.transform = tr;
  el.style.visibility = (o.op ?? 1) <= 0.002 ? 'hidden' : 'inherit';

function wavePath(t, amp, seed, reveal = 1) {
  const pts = [], n = 56, x0 = 14, x1 = 208, cy = 96;
  const m = Math.floor(n * clamp(reveal));
  for (let i = 0; i <= m; i++) {
    const u = i / n, x = x0 + (x1 - x0) * u;
    const env = 0.35 + 0.65 * Math.exp(-(((u - 0.34) / 0.13) ** 2)) + 0.55 * Math.exp(-(((u - 0.74) / 0.12) ** 2));
    const y = Math.sin(u * 31 + t * 7.3 + seed) * 0.55 + Math.sin(u * 67 - t * 11.1 + seed * 2) * 0.35 + Math.sin(u * 13 + t * 3.1) * 0.25;
    pts.push(`${i ? 'L' : 'M'}${x.toFixed(1)} ${(cy - y * env * amp).toFixed(1)}`);
  }

}

function dot(x, y, r, col, a) {
  if (a <= 0.003 || r <= 0) return;
  const g = cx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(0.45, `rgba(${col},${a * 0.5})`); g.addColorStop(1, `rgba(${col},0)`);

}
function drawFX(t, ctx) {
  cx.clearRect(0, 0, W, H);
  cx.globalCompositeOperation = 'lighter';
  // dust field (all scenes except game): reprojected by the active scene camera
  if (ctx.dust) {
    for (const p of PRT) {
      const drift = 14 * Math.sin(t * 0.6 + p.ph);
      const q = ctx.dust(p.x + drift, p.y - t * 12 / p.dz, p.dz);
      if (!q) continue;
      const r = p.sz * Math.min(q.s, 6) * 1.6 + 1, a = ctx.dustA * clamp(0.25 + 0.6 / p.dz) * (0.6 + 0.4 * Math.sin(t * 3 + p.ph));
      dot(q.x, q.y, r * 2.2, p.g ? '134,255,0' : '245,245,245', a * 0.55);
    }
  }
  if (ctx.embers) {
    for (const e of EMB) {
      const y = ((e.y - t * e.sp) % 2100 + 2100) % 2100 - 90;
      const q = ctx.embers(e.x + 30 * Math.sin(t * 1.3 + e.ph), y, e.dz);
      if (!q) continue;
      const near = e.dz < 0.05, r = e.sz * q.s * (near ? 3.2 : 1.4);
      dot(q.x, q.y, r, e.c.join(','), ctx.embA * (near ? 0.16 : 0.42) * (0.6 + 0.4 * Math.sin(t * 4 + e.ph)));
    }
  }
  if (ctx.core > 0) {   // magnetic pull: light gathers in the centre
    dot(FX, FY, 60 + 260 * ctx.core, '134,255,0', 0.55 * ctx.core);
    dot(FX, FY, 14 + 70 * ctx.core, '235,255,210', 0.9 * ctx.core);
    if (ctx.lines > 0) {
      cx.lineCap = 'round';
      const r = mulberry32(5);
      for (let i = 0; i < 26; i++) {
        const a0 = r() * 6.2832, d0 = 380 + r() * 700, sp = 0.6 + r() * 0.8;
        const u = clamp(ctx.lines * sp), d1 = d0 * (1 - u), d2 = d1 + 120 * (1 - u) + 30;
        const al = 0.22 * Math.sin(Math.PI * u);
        if (al <= 0.01) continue;
        cx.strokeStyle = `rgba(160,255,80,${al})`; cx.lineWidth = 2;
        const a = a0 + u * 0.9;
        cx.beginPath(); cx.moveTo(FX + Math.cos(a) * d1, FY + Math.sin(a) * d1); cx.lineTo(FX + Math.cos(a - 0.05) * d2, FY + Math.sin(a - 0.05) * d2); cx.stroke();
      }
    }
  }
  if (ctx.flash > 0) {
    const f = ctx.flash, R = 140 + 1500 * ctx.flashR;
    dot(FX, FY, R, '200,255,150', 0.75 * f);
    dot(FX, FY, R * 0.35, '255,255,255', 0.9 * f);
    // anamorphic streak through the core
    const g = cx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, 'rgba(134,255,0,0)'); g.addColorStop(0.5, `rgba(235,255,210,${0.8 * f})`); g.addColorStop(1, 'rgba(134,255,0,0)');
    cx.fillStyle = g; cx.fillRect(0, FY - 3 - 6 * f, W, 6 + 12 * f);
  }
  cx.globalCompositeOperation = 'source-over';
}

// ============================================================ seek
const el = id => $(id);
const S = {};
['s1', 'xmark', 'xglow', 'hudx', 'whip', 's2clip', 's2mask', 's2rot', 's2', 's2_globe', 's2_spark', 's2_cross', 's2_term', 's2_pad', 's2_dash', 's2_near1', 's2_near2',
  's3', 'g_bg', 'g_char', 'g_fog1', 'g_fog2', 'g_win', 'g_over', 'g_spill', 'g_ret', 'g_pad', 's2_halo', 's4', 'gbars', 'c_globe', 'c_s1', 'c_s2', 'c_cross', 'c_dash', 'c_web', 'c_app', 'c_game', 'c_near',
  'k_app', 'k_game', 'k_web', 'k_ui', 'k_next', 's6', 's6cam', 'bglow', 'badge', 'sweep', 'tag1', 'tag2', 'act', 'flash', 'grain'].forEach(k => S[k] = $(k));
const vis = (e, on) => { e.classList.toggle('hide', !on); };

window.seek = async function (t) {
  t = clamp(t, 0, DUR - 1e-4);
  const fctx = { dust: null, dustA: 0, embers: null, embA: 0, core: 0, lines: 0, flash: 0, flashR: 0 };

  // ---------------------------------------------------------------- S1 hook (0 - 0.80)
  vis(S.s1, t < T_S2);
  let xs = 1, xr = 0;
  if (t < T_S2) {
    const land = t < T_LAND ? 1 + 0.9 * (1 - E.outExpo(t / T_LAND)) : 1 - 0.04 * Math.exp(-(t - T_LAND) * 13) * Math.sin((t - T_LAND) * 34);
    const idle = 1 + 0.035 * E.ioC(pr(t, 0.09, T_ANT));
    const ant = 1 - 0.075 * E.outC(pr(t, T_ANT, T_RUSH));
    const rush = Math.exp(Math.log(X_END) * Math.pow(pr(t, T_RUSH, T_S2), 3));
    xs = land * idle * ant * rush;
    xr = (t < T_LAND ? lerp(-16, -3, E.outExpo(t / T_LAND)) : lerp(-3, 2, E.ioC(pr(t, T_LAND, T_ANT)))) * (1 - E.outC(pr(t, T_ANT, T_RUSH))) + 9 * E.inC(pr(t, T_RUSH, T_S2));
    const sc = XB * xs;
    S.xmark.style.transform = `translate(${FX}px,${FY}px) rotate(${xr.toFixed(3)}deg) scale(${sc.toFixed(5)}) translate(${-META.x_core[0]}px,${-META.x_core[1]}px)`;
    const gl = (t < 0.2 ? 1 + 1.4 * Math.exp(-(t - T_LAND) * 14) * (t > T_LAND ? 1 : t / T_LAND) : 1) * (0.62 + 0.18 * Math.sin(t * 9)) * (1 - E.ioC(pr(t, 0.6, 0.78)));
    const gs = Math.min(xs, 6);
    S.xglow.style.transform = `translate(${FX}px,${FY}px) scale(${(gs * 0.82).toFixed(4)}) translate(-450px,-450px)`;
    S.xglow.style.opacity = clamp(gl, 0, 1.6).toFixed(3);
    // HUD brackets: draw in, counter-rotate a little, fly out with the zoom
    const hp = E.outQ4(pr(t, 0.05, 0.32)), hs = (1.25 - 0.25 * hp) * Math.min(xs, 40) * (1 + 0.02 * Math.sin(t * 5));
    S.hudx.style.transform = `translate(${FX}px,${FY}px) rotate(${(-xr * 0.5).toFixed(3)}deg) scale(${hs.toFixed(4)}) translate(-300px,-300px)`;
    S.hudx.style.opacity = (hp * (1 - pr(t, 0.62, 0.74))).toFixed(3);
    fctx.dust = (x, y, dz) => proj({ x: FX, y: FY, z: 1 / xs, roll: xr * 0.3, fx: FX, fy: FY }, x, y, dz * 0.6 + 0.4);
    fctx.dustA = 0.5 * pr(t, 0.0, 0.2);
  }

  // ---------------------------------------------------------------- whip strip: S2 + S3 (0.52 - 3.86)
  const whipOn = t >= T_RUSH && t < 3.88;
  vis(S.whip, whipOn);
  if (whipOn) {
    const wp = E.ioQ4(pr(t, T_WHIP0, T_WHIP1));
    const ox = -WHIP_DX * wp;
    const vel = WHIP_DX * (E.ioQ4(pr(t + 1 / 120, T_WHIP0, T_WHIP1)) - E.ioQ4(pr(t - 1 / 120, T_WHIP0, T_WHIP1))) / 60;  // px per frame
    S.whip.style.transform = `translateX(${ox.toFixed(2)}px)`;
    S.whip.style.filter = Math.abs(vel) > 3 ? `blur(${Math.min(28, Math.abs(vel) * 0.11).toFixed(2)}px)` : '';

    // ---- S2 dashboard world
    const s2on = t < T_WHIP1 + 0.02;
    vis(S.s2clip, s2on);
    if (s2on) {
      if (t < T_S2) {   // X window: mask follows the X (wrapper rotates with it, content counter-rotates)
        const sc = XB * xs, ox2 = FX + 600, oy2 = FY + 600;
        S.s2mask.style.transformOrigin = `${ox2}px ${oy2}px`;
        S.s2mask.style.transform = `rotate(${xr.toFixed(3)}deg)`;
        S.s2rot.style.transformOrigin = `${ox2}px ${oy2}px`;
        S.s2rot.style.transform = `rotate(${(-xr).toFixed(3)}deg)`;
        const m = 'url(assets/x_inner.png)';
        S.s2mask.style.webkitMaskImage = S.s2mask.style.maskImage = m;
        S.s2mask.style.webkitMaskRepeat = S.s2mask.style.maskRepeat = 'no-repeat';
        S.s2mask.style.webkitMaskSize = S.s2mask.style.maskSize = `${(344 * sc).toFixed(2)}px ${(344 * sc).toFixed(2)}px`;
        S.s2mask.style.webkitMaskPosition = S.s2mask.style.maskPosition = `${(ox2 - META.x_core[0] * sc).toFixed(2)}px ${(oy2 - META.x_core[1] * sc).toFixed(2)}px`;
        S.s2rot.style.opacity = E.ioC(pr(t, 0.55, 0.67)).toFixed(3);
      } else {
        S.s2mask.style.transform = S.s2rot.style.transform = '';
        S.s2mask.style.webkitMaskImage = S.s2mask.style.maskImage = 'none';
        S.s2rot.style.opacity = 1;
      }
      const c2 = camS2(t);
      const ry = lerp(-27, -7, E.outC(pr(t, T_RUSH, 1.6))) * (1 - E.ioC(pr(t, 1.6, 2.15)));
      const rx = lerp(9, 2.5, E.outC(pr(t, T_RUSH, 1.6))) * (1 - E.ioC(pr(t, 1.6, 2.15)));
      place(S.s2_dash, proj(c2, 560, 840, 0), { w: 960, h: 532, k: 1.0, ry, rx, persp: 2200 });
      place(S.s2_halo, proj(c2, 560, 860, 0.12), { w: 1600, h: 1000, op: 0.8 + 0.2 * Math.sin(t * 4) + 0.8 * Math.exp(-Math.max(0, t - T_S2) / 0.35) * pr(t, 0.6, T_S2) });
      const rim = Math.max(0.75 * Math.exp(-Math.max(0, t - T_S2) / 0.3) * pr(t, 0.6, T_S2), 0.16 * pr(t, T_S2, 1.0));
      S.s2_dash.firstElementChild.style.boxShadow = `0 40px 120px rgba(0,0,0,.65), 0 0 0 1.5px rgba(134,255,0,${rim.toFixed(3)}), 0 0 70px rgba(134,255,0,${(rim * 0.35).toFixed(3)})`;
      S2GLARE.style.left = `${lerp(-40, 140, E.ioC(pr(t, 0.92, 1.6)))}%`;
      updDash(S.s2_dash.firstElementChild, t - 0.8, t);
      S.s2_globe.innerHTML = globeSVG(280, t * 0.9);
      place(S.s2_globe, proj(c2, 810, 330, 0.9), { w: 560, h: 560, rot: 12, blur: 1.2 });
      place(S.s2_spark, proj(c2, 150, 1290, 0.4), { w: 100, h: 100, k: 0.62, rot: 20 * t, op: 0.9 });
      place(S.s2_cross, proj(c2, 965, 1240, 0.55), { w: 100, h: 100, k: 1.0, rot: -30 * t, blur: 0.6 });
      place(S.s2_term, proj(c2, 165, 455, 0.5), { w: 100, h: 80, k: 0.95, rot: -6, blur: 0.8 });
      place(S.s2_pad, proj(c2, 905, 1540, 0.3), { w: 120, h: 80, k: 1.0, rot: 8 });
      place(S.s2_near1, proj(c2, 90, 300, -0.42), { w: 100, h: 100, k: 1.1, rot: 15 + 25 * t, blur: 9, op: 0.75 });
      place(S.s2_near2, proj(c2, 1010, 1660, -0.36), { w: 220, h: 32, k: 1.0, blur: 7, op: 0.8 });
      if (t >= T_S2) { fctx.dust = (x, y, dz) => { const q = proj(c2, x, y, dz * 0.8); return q && { x: q.x + ox, y: q.y, s: q.s }; }; fctx.dustA = 0.55 * (1 - pr(t, 2.2, 2.45)); }
    }
    // ---- S3 game world
    const s3on = t > T_WHIP0 - 0.02;
    vis(S.s3, s3on);
    if (s3on) {
      const c3 = camS3(t);
      const KG = 0.8, ix = (c3.x - 540) * 0.3;                    // image sits behind the glass: inner parallax
      const ry3 = lerp(9, -3, E.ioC(pr(t, 2.3, 3.8))), rx3 = lerp(4, 1, E.ioC(pr(t, 2.3, 3.8)));
      const pw = proj(c3, 540, 1000, 0), ow = { w: 1000, h: 800, ry: ry3, rx: rx3, persp: 2600 };
      place(S.g_win, pw, ow); place(S.g_over, pw, ow);
      place(S.g_spill, proj(c3, 540, 1000, 0.25), { w: 1700, h: 1300, op: 0.9 + 0.1 * Math.sin(t * 3) });
      const rack = E.ioC(pr(t, 2.85, 3.35));
      const imgTr = `translate(${(500 - 858 * KG + ix).toFixed(2)}px,${(800 - 1392 * KG).toFixed(2)}px) scale(${KG})`;
      S.g_bg.style.transform = imgTr; S.g_bg.style.filter = rack > 0.01 ? `blur(${(2.6 * rack).toFixed(2)}px)` : '';
      // character + rock: same plane as the image, breathing anchored on the rock, the cap breaks out of the frame
      const br = 1 + 0.011 * Math.sin((t - 2.3) * 4.6), sway = 0.55 * Math.sin((t - 2.3) * 2.3);
      S.g_char.style.transform = imgTr + ` translate(858px,1300px) rotate(${sway.toFixed(3)}deg) scale(1,${br.toFixed(4)}) translate(-858px,-1300px)`;
      S.g_fog1.style.transform = `translate(${(-350 + 140 * Math.sin(t * 0.9) + ix * 0.6).toFixed(1)}px,${-250}px)`;
      S.g_fog2.style.transform = `translate(${(-200 - 180 * Math.sin(t * 0.7 + 1) + ix * 0.4).toFixed(1)}px,${420}px)`;
      const hp = E.outC(pr(t, 2.42, 2.72));
      S.g_over.querySelectorAll('.gtag,.br,#g_pad').forEach(e => { e.style.opacity = hp.toFixed(3); });
      const lock = spring(t - 2.62, 260, 24);
      place(S.g_ret, { x: 500 + ix, y: 70, s: 1 }, { w: 240, h: 240, k: lerp(1.9, 1.0, lock) * (1 + 0.02 * Math.sin(t * 9)), rot: 40 * t, op: clamp(lock * 1.5) * 0.9 });
      place(S.g_pad, { x: 930, y: -62, s: 1 }, { w: 120, h: 80, k: 0.62, rot: 4 * Math.sin(t * 2) });
      fctx.embers = (x, y, dz) => { const q = proj(c3, x, y, dz); return q && { x: q.x + ox + WHIP_DX, y: q.y, s: q.s }; };
      fctx.embA = pr(t, 2.2, 2.5) * (1 - pr(t, 3.7, 3.86));
    }
  }

  // ---------------------------------------------------------------- S4/S5 web cluster + chain (3.62 - 6.82)
  const s4on = t >= T_GL0 && t < T_FLASH + 0.03;
  vis(S.s4, s4on); vis(S.gbars, t >= T_GL0 && t < 3.95);
  if (t >= T_GL0 && t < 3.95) {   // glitch wipe: bands of S4 slide in from the right, neon leading edges
    let path = '';
    GB.forEach((b, i) => {
      const p = E.ioQ4(pr(t, T_GL0 + b.d, T_GL0 + b.d + 0.2));
      const xL = lerp(1080, 0, p);
      if (p > 0) path += `M${xL.toFixed(1)} ${b.y}H1080V${b.y + b.h}H${xL.toFixed(1)}Z`;
      const g = S.gbars.children[i];
      g.style.transform = `translateX(${(xL - b.lead * 0.5).toFixed(1)}px) scaleX(${(1 + 1.5 * Math.sin(Math.PI * p)).toFixed(3)})`;
      g.style.opacity = (Math.sin(Math.PI * p) ** 0.6).toFixed(3);
    });
    S.s4.style.clipPath = path ? `path('${path}')` : 'inset(0 0 0 100%)';
  } else S.s4.style.clipPath = '';
  if (s4on) {
    const c4 = camS4(t);
    const pullE = i => Math.pow(pr(t, T_PULL + 0.025 * i, T_FLASH), 2.3);
    const fade = 1 - E.ioC(pr(t, 5.15, 5.5));                    // focus moves to the front cards
    const dimC = lerp(1, 0.38, 1 - fade), blC = 4.5 * (1 - fade);
    const wa = t - 3.64;
    const fl = (i, ax = 7, ay = 9) => [ax * Math.sin(t * 0.9 + i * 1.7), ay * Math.sin(t * 1.15 + i * 2.3)];
    place(S.c_web, pull(proj(c4, 540 + fl(0)[0], 860 + fl(0)[1], 0), pullE(0)), { w: 1000, h: 622, k: 0.66, blur: blC, dim: dimC });
    updWeb(S.c_web.querySelector('.web'), wa, t);
    place(S.c_dash, pull(proj(c4, 318 + fl(1)[0], 452 + fl(1)[1], 0.22), pullE(0)), { w: 960, h: 532, k: 0.56, rot: -4.5 + 1.2 * Math.sin(t * 1.1), blur: 1.1 + blC, dim: 0.82 * dimC });
    updDash(S.c_dash.querySelector('.dash'), 99, t);
    place(S.c_game, pull(proj(c4, 790 + fl(2)[0], 1300 + fl(2)[1], -0.12), pullE(1)), { w: 560, h: 460, rot: 4 + 1.0 * Math.sin(t * 1.3 + 1), blur: blC, dim: dimC });
    place(S.c_app, pull(proj(c4, 262 + fl(3)[0], 1238 + fl(3)[1], -0.05), pullE(1)), { w: 420, h: 332, rot: -3 + 1.0 * Math.sin(t * 1.2 + 2), blur: blC, dim: dimC });
    S.c_globe.innerHTML = globeSVG(360, t * 0.7);
    place(S.c_globe, pull(proj(c4, 820, 380, 1.4), pullE(0)), { w: 720, h: 720, blur: 1.5, op: 0.9 });
    place(S.c_s1, pull(proj(c4, 940, 1000, 0.35), pullE(0)), { w: 100, h: 100, k: 0.55, rot: 25 * t });
    place(S.c_s2, pull(proj(c4, 120, 860, 0.6), pullE(0)), { w: 100, h: 100, k: 0.38, rot: -20 * t, op: 0.8 });
    place(S.c_cross, pull(proj(c4, 965, 1590, 0.25), pullE(0)), { w: 100, h: 100, k: 0.9, rot: -35 * t, op: 0.8 });
    place(S.c_near, pull(proj(c4, 60, 1520, -0.32), pullE(0)), { w: 100, h: 100, k: 1.1, rot: 30 * t, blur: 8, op: 0.7 });

    // chain: APP -> GAME -> WEB -> UI -> X.???, each lands on an 8th note, older cards step back in the deck
    const cards = [S.k_app, S.k_game, S.k_web, S.k_ui, S.k_next];
    const from = [[-760, 0, -14], [1840, 0, 13], [540, 2300, -7], [540, -900, 8], null];
    cards.forEach((c, i) => {
      const tl = T_K[i], ts = tl - 0.13;
      if (t < ts) { c.style.visibility = 'hidden'; return; }
      let lvl = 0; for (let j = i + 1; j < 5; j++) lvl += spring(t - (T_K[j] - 0.06), 320, 30);
      let x = 540, y = 900, rot = 0, k = 1, op = 1, blur = 0;
      if (from[i]) {
        const p = E.outQ4(pr(t, ts, tl));
        x = lerp(from[i][0], 540, p); y = lerp(from[i][1] || 900, 900, p); if (!from[i][1]) y = 900;
        const a = Math.max(0, t - tl), bump = a > 0 ? (a / 0.045) * Math.exp(1 - a / 0.045) : 0;   // starts at 0: no pop
        rot = lerp(from[i][2], 0, p) - from[i][2] * 0.1 * bump;
        k = 1 + 0.025 * bump;
      } else {
        const sp = spring(t - ts, 190, 21);
        k = lerp(0.25, 1, sp); op = clamp((t - ts) / 0.07); blur = 10 * (1 - clamp(sp));
      }
      y -= 64 * lvl; k *= 1.1 * Math.pow(0.9, lvl);
      const live = 0.004 * Math.sin(t * 2.4 + i);
      let p = { x, y, s: k * (1 + live), rot };
      p = pull(p, pullE(i < 4 ? 2 + (3 - i) * 0.6 : 4.2));
      place(c, p, { w: 660, h: 620, op, blur: blur + 0.9 * lvl, dim: 1 - 0.2 * Math.min(lvl, 3) });
      const d = c.querySelector('.dash'), w = c.querySelector('.web');
      if (d) updDash(d, 99, t); if (w) updWeb(w, 99, t);
    });
    // the "?" breathes while it waits
    const qi = S.k_next.querySelector('.cimg img'); qi.style.transform = `scale(${(1 + 0.04 * Math.sin((t - 6.05) * 9) * pr(t, 6.05, 6.2)).toFixed(4)})`;
    const pullAll = E.inC(pr(t, T_PULL, T_FLASH));
    fctx.dust = (x, y, dz) => pull(proj(c4, x, y, dz), E.inC(pr(t, T_PULL, T_FLASH)), 60);
    fctx.dustA = 0.5 * pr(t, 3.8, 4.1);
    fctx.core = E.inQ(pr(t, T_PULL - 0.05, T_FLASH));
    fctx.lines = pr(t, T_PULL - 0.08, T_FLASH);
  }

  // ---------------------------------------------------------------- flash + logo (6.80 - 9.00)
  const s6on = t >= T_FLASH - 0.01;
  vis(S.s6, s6on);
  if (t >= T_FLASH - 0.03 && t < T_FLASH + 0.6) {
    const a = t - T_FLASH;
    fctx.flash = a < 0 ? 0 : Math.exp(-a * 9) * clamp(a / 0.02);
    fctx.flashR = E.outExpo(clamp(a / 0.22));
  }
  if (s6on) {
    const a = t - T_FLASH;
    const sp = spring(a, 180, 21), sr = spring(a, 150, 20);
    const fin = E.outC(pr(t, T_FIN, DUR));                        // final micro zoom
    const cam = 1 + 0.018 * E.ioC(pr(t, 7.0, 8.6)) + 0.04 * fin;
    S.s6cam.style.transform = `translate(${FX}px,${FY + 60}px) scale(${cam.toFixed(5)}) translate(${-FX}px,${-FY - 60}px)`;
    const k = lerp(0.26, 1, sp) * 0.675;
    const ry = lerp(20, -4, sr) + 7 * E.ioC(pr(t, 7.3, 9.0)), rx = lerp(8, 2, sr) - 3.5 * E.ioC(pr(t, 7.3, 9.0));
    place(S.badge, { x: FX, y: FY, s: 1 }, { w: 1096, h: 1096, k, rot: lerp(-15, 0, sr), ry, rx, persp: 2600, blur: 12 * (1 - E.outC(pr(a, 0, 0.28))), op: clamp(a / 0.05) });
    const gp = 0.42 + 0.58 * Math.exp(-Math.max(a, 0) * 3.2) + 0.06 * Math.sin(t * 2.4);
    place(S.bglow, { x: FX, y: FY, s: 1 }, { w: 1300, h: 1300, k: lerp(0.5, 1, sp), op: clamp(a / 0.08) * gp });
    S.sweep.style.left = `${lerp(-40, 120, E.ioC(pr(t, 7.02, 7.5)))}%`;
    // tagline: masked rise per word + tracking in; activity line: quick stagger
    const words = [...S.tag1.querySelectorAll('.w>span'), ...S.tag2.querySelectorAll('.w>span')];
    words.forEach((w, i) => {
      const p = E.outQ4(pr(t, T_TAG + 0.06 * i, T_TAG + 0.06 * i + 0.42));
      w.style.transform = `translateY(${((1 - p) * 110).toFixed(2)}%) rotate(${((1 - p) * 7).toFixed(2)}deg)`;
    });
    const trk = E.outExpo(pr(t, T_TAG, T_TAG + 0.75));
    S.tag1.style.letterSpacing = S.tag2.style.letterSpacing = `${lerp(0.22, 0.015, trk).toFixed(4)}em`;
    const px = -ry * 1.6;
    S.tag1.style.transform = `translateX(${px.toFixed(2)}px)`; S.tag2.style.transform = `translateX(${(px * 1.15).toFixed(2)}px)`;
    S.act.querySelectorAll('.w>span').forEach((w, i) => {
      const p = E.outQ4(pr(t, T_ACT + 0.04 * i, T_ACT + 0.04 * i + 0.3));
      w.style.transform = `translateY(${((1 - p) * 110).toFixed(2)}%)`;
    });
    S.act.style.transform = `translateX(${(px * 1.3).toFixed(2)}px)`;
    fctx.dust = (x, y, dz) => proj({ x: FX, y: FY + 40 * pr(t, 6.8, 9), z: 1 / cam, roll: 0, fx: FX, fy: FY }, x, y, dz + 0.3);
    fctx.dustA = 0.42 * pr(t, 6.9, 7.4);
  }

  drawFX(t, fctx);
  const fr = Math.floor(t * FPS);
  S.grain.style.backgroundPosition = `${Math.floor(hash(fr) * 256)}px ${Math.floor(hash(fr + 999) * 256)}px`;
  if (window.__hud) window.__hud.textContent = `t ${t.toFixed(3)}  f ${fr}  beat ${((t - T0) / B).toFixed(2)}`;
};

// ============================================================ boot + preview controls (never used by the renderer)
(async function boot() {
  await Promise.all([...document.images].map(i => i.decode().catch(() => { })));
  await document.fonts.load('700 40px SG'); await document.fonts.load('500 40px JB'); await document.fonts.load('400 40px SG');
  await document.fonts.ready;
  // preload the mask image
  await new Promise(r => { const i = new Image(); i.onload = r; i.onerror = r; i.src = 'assets/x_inner.png'; });
  const qs = new URLSearchParams(location.search);
  if (!qs.has('render')) {
    window.__hud = $('hudctl');
    let t = parseFloat(qs.get('t') || '0'), playing = !qs.has('t'), last = null;
    const loop = ts => { if (playing) { if (last !== null) t += (ts - last) / 1000; if (t >= DUR) t = 0; } last = ts; seek(t); requestAnimationFrame(loop); };
    addEventListener('keydown', e => {
      if (e.code === 'Space') { playing = !playing; last = null; }
      if (e.code === 'ArrowRight') { playing = false; t = Math.min(DUR - 1 / FPS, t + (e.shiftKey ? 1 / FPS : 0.5)); }
      if (e.code === 'ArrowLeft') { playing = false; t = Math.max(0, t - (e.shiftKey ? 1 / FPS : 0.5)); }
      if (e.code === 'KeyR') { t = 0; playing = true; }
    });
    requestAnimationFrame(loop);
  } else { $('hudctl').remove(); }
  await seek(0);
  window.ready = true;
})();
</script>
</body>
